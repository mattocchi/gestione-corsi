server.port=${PORT:8080}
logging.level.org.atmosphere = warn

# Profilo di default quando non ne viene indicato uno (in produzione usare --spring.profiles.active=prod)
spring.profiles.default=dev

# Packages scansionati da Vaadin per route e componenti
# https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,it.attocchi

# JPA/Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Dati dell'associazione in testata a ricevute e conferme di iscrizione (valori reali da variabili d'ambiente)
app.associazione.nome=${ASSOCIAZIONE_NOME:Mosson Drum & Bugle Corps}
app.associazione.indirizzo=${ASSOCIAZIONE_INDIRIZZO:}
app.associazione.codice-fiscale=${ASSOCIAZIONE_CODICE_FISCALE:}
app.associazione.email=${ASSOCIAZIONE_EMAIL:}
app.associazione.iban=${ASSOCIAZIONE_IBAN:}

# Invio email: reale solo se MAIL_HOST è impostata, altrimenti simulato (registrato e scritto nel log).
# Non si usa spring.mail.*: con un host vuoto Spring Boot creerebbe comunque il JavaMailSender.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.starttls=${MAIL_STARTTLS:true}
