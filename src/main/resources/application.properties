server.port=${PORT:8080}
logging.level.org.atmosphere = warn

# Profilo di default quando non ne viene indicato uno (in produzione usare --spring.profiles.active=prod)
spring.profiles.default=dev

# Packages scansionati da Vaadin per route e componenti
# https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,it.attocchi

# JPA/Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Dati dell'associazione in testata a ricevute e conferme di iscrizione (valori reali da variabili d'ambiente)
app.associazione.nome=${ASSOCIAZIONE_NOME:Mosson Drum & Bugle Corps}
app.associazione.indirizzo=${ASSOCIAZIONE_INDIRIZZO:}
app.associazione.codice-fiscale=${ASSOCIAZIONE_CODICE_FISCALE:}
app.associazione.email=${ASSOCIAZIONE_EMAIL:}
app.associazione.iban=${ASSOCIAZIONE_IBAN:}
# Località di "Luogo e data" nella dichiarazione delle spese per la detrazione (es. Roma)
app.associazione.luogo=${ASSOCIAZIONE_LUOGO:}

# Invio email: reale solo se MAIL_HOST è impostata, altrimenti simulato (registrato e scritto nel log).
# Non si usa spring.mail.*: con un host vuoto Spring Boot creerebbe comunque il JavaMailSender.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.starttls=${MAIL_STARTTLS:true}

# Indirizzo pubblico dell'applicazione, usato nei link delle email (es. https://corsi.example.it): mai ricavato dalla
# richiesta, per non permettere link falsificati tramite l'header Host
app.url=${APP_URL:http://localhost:8080}

# Recupero password: ore di validità del link inviato via email
app.password-reset.validita-ore=${PASSWORD_RESET_VALIDITA_ORE:36}

# "Ricordami" all'accesso: chiave di firma dei cookie (in produzione da REMEMBER_ME_KEY; vuota = casuale a ogni avvio)
app.remember-me.key=${REMEMBER_ME_KEY:}

# Health check per il monitoraggio: GET /actuator/health, senza login, 200 {"status":"UP"} o 503 {"status":"DOWN"}.
# Esposto solo questo endpoint; i dettagli (database, disco) solo agli admin collegati. Il server email non è controllato:
# un SMTP lento o irraggiungibile non deve far risultare l'applicazione ferma.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
management.health.mail.enabled=false
# Niente gruppi liveness/readiness (attivi di default da Spring Boot 4): basta lo stato generale
management.endpoint.health.probes.enabled=false
