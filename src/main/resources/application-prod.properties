# Profilo di produzione: MySQL (vedi setup-mysql.sql)
# Le credenziali vanno fornite tramite variabili d'ambiente, non committate.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestione_corsi?useSSL=false&serverTimezone=Europe/Rome}
spring.datasource.username=${DB_USERNAME:gestione_corsi_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# TODO: sostituire con migrazioni Flyway (vedi docs/PIANO-CORREZIONI.md, "Fuori ambito")
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
vaadin.launch-browser=false
